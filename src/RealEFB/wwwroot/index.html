<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RealEFB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="favicon.ico" />
  <!-- Vendored locally (v1.9.4), not CDN-linked - see wwwroot/vendor/leaflet - powers the Flight
       Tracker tab's moving map. Live basemap tiles still come from an external tile server at
       runtime (see initTrackerMap in app.js), same internet dependency the app already has for
       SimBrief/weather. -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <script>
    try { document.body.dataset.wallpaper = localStorage.getItem("realefb.wallpaper") || "sky"; } catch {}
  </script>

  <div id="wallpaper"></div>
  <div id="noise"></div>

  <div id="statusbar">
    <div class="statusbar-left hidden">
      <span id="clock">--:--</span>
      <span id="date"></span>
    </div>
    <div class="statusbar-right">
      <span id="connection-icon" class="status-icon" title="Server connection"></span>
      <span id="wifi-icon" class="status-icon"></span>
      <span id="battery-group">
        <span id="battery-icon" class="status-icon"></span>
      </span>
    </div>
  </div>

  <button id="loadsheet-notification" class="loadsheet-notif hidden" type="button">
    <span class="loadsheet-notif-icon">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v12H9l-4 4V4z"/><path d="M8 9h8M8 12.5h5"/></svg>
    </span>
    <span class="loadsheet-notif-text">
      <span class="loadsheet-notif-title">Loadsheet Received</span>
      <span class="loadsheet-notif-sub">Tap to view Dispatch</span>
    </span>
  </button>

  <main id="wizard-screen" class="hidden">
    <div class="init-card wizard-card">
      <p class="wizard-progress" id="wizard-progress"></p>
      <div id="wizard-body"></div>
      <p id="wizard-status" class="init-status"></p>
      <div class="wizard-nav">
        <button id="wizard-back" class="wizard-back-btn">Back</button>
        <button id="wizard-next" class="wizard-next-btn">Next</button>
      </div>
    </div>
  </main>

  <main id="init-screen" class="hidden">
    <div class="init-card">
      <!-- Lucide's "plane" icon (ISC-licensed) - same reasoning as ICONS in app.js: a hand-drawn
           path here didn't sit on the grid quite right, so this is exact path data from a real
           icon set instead. -->
      <div class="init-icon"><svg viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></div>
      <h1 class="init-title">Initialize Flight</h1>
      <p class="init-subtitle">Enter your SimBrief username or pilot ID to load your latest flight plan.</p>
      <input id="init-simbrief-id" type="text" placeholder="e.g. jdoe123" autocomplete="off" />
      <button id="init-button">Initialize Flight</button>
      <p id="init-status" class="init-status"></p>
    </div>
  </main>

  <main id="home-screen" class="hidden">
    <div class="tile-grid" id="tile-grid"></div>
  </main>

  <main id="detail-screen" class="hidden">
    <h1 id="detail-title"></h1>
    <div id="detail-body"></div>
  </main>

  <button id="home-button" class="hidden" aria-label="Home">
    <span id="home-button-ring"></span>
  </button>

  <script src="js/flightlog-report.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
